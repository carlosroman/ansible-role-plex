---
# defaults file for plex role

# APT repository settings (Debian/Ubuntu)
plex_repo_uri: "https://repo.plex.tv/deb/"
plex_repo_suite: public
plex_repo_key_url: "https://downloads.plex.tv/plex-keys/PlexSign.v2.key"

# YUM/DNF repository settings (RedHat/Fedora/CentOS)
plex_rpm_repo_uri: "https://repo.plex.tv/rpm/"

# Package to install
plex_package: plexmediaserver

# Service management
plex_service_name: plexmediaserver
plex_service_state: started
plex_service_enabled: true

# Service configuration via systemd drop-in override.conf.
# Set to null to leave the directive at the Plex default.
plex_data_dir: null # PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR
plex_temp_dir: null # TMPDIR (transcoding temp)
plex_run_user: null # Run the service as this user (must exist)
plex_run_group: null # Run the service as this group (must exist)

# Escape hatch: any additional [Service] directives. Example:
# plex_service_overrides:
#   LimitNOFILE: 65536
#   NoNewPrivileges: "true"
plex_service_overrides: {}
