---

- name: Add Plex Media Server repository
  ansible.builtin.yum_repository:
    name: PlexTv
    description: Plex.tv
    baseurl: "{{ plex_rpm_repo_uri }}"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "{{ plex_repo_key_url }}"
    state: present
    file: PlexTv
  register: plex_rpm_repo
