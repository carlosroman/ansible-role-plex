---
- name: Run setup tasks
  ansible.builtin.include_tasks: setup-{{ ansible_facts.os_family }}.yml

- name: Update apt cache if Plex repository changed
  ansible.builtin.apt:
    update_cache: true
  when: plex_repo is defined and plex_repo.changed

- name: Update yum cache if Plex repository changed
  ansible.builtin.yum:
    update_cache: true
  when: plex_rpm_repo is defined and plex_rpm_repo.changed

- name: Install Plex Media Server
  ansible.builtin.package:
    name: "{{ plex_package }}"
    state: present

# The Plex postinst skips user, directory, and systemd unit setup when it
# detects a Docker container. Complete those steps in that case only; on
# bare metal, VMs, and LXC the postinst performs them itself.
- name: Check for Plex Media Server systemd unit
  ansible.builtin.stat:
    path: "/lib/systemd/system/{{ plex_service_name }}.service"
  register: plex_service_unit

- name: Complete installation steps skipped by Plex postinst in Docker
  when:
    - not plex_service_unit.stat.exists
    - ansible_virtualization_type == 'docker'
  block:
    - name: Ensure plex group exists
      ansible.builtin.group:
        name: plex
        system: true
        state: present

    - name: Ensure plex user exists
      ansible.builtin.user:
        name: plex
        group: plex
        system: true
        home: /var/lib/plexmediaserver
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Create Plex data directory
      ansible.builtin.file:
        path: "/var/lib/plexmediaserver/Library/Application Support/Plex Media Server"
        state: directory
        owner: plex
        group: plex
        mode: "0755"

    - name: Install Plex Media Server systemd unit
      ansible.builtin.copy:
        src: /usr/lib/plexmediaserver/lib/plexmediaserver.service
        dest: "/lib/systemd/system/{{ plex_service_name }}.service"
        remote_src: true
        mode: "0644"

    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Determine whether Plex service overrides are configured
  ansible.builtin.set_fact:
    plex_overrides_configured: >-
      {{ plex_data_dir | default('', true) | length > 0
         or plex_temp_dir | default('', true) | length > 0
         or plex_run_user | default('', true) | length > 0
         or plex_run_group | default('', true) | length > 0
         or (plex_service_overrides | length > 0) }}

- name: Create custom Plex data directory
  ansible.builtin.file:
    path: "{{ plex_data_dir }}"
    state: directory
    owner: "{{ plex_run_user | default('plex', true) }}"
    group: "{{ plex_run_group | default('plex', true) }}"
    mode: "0755"
  when: plex_data_dir | default('', true) | length > 0

- name: Create custom Plex temp directory
  ansible.builtin.file:
    path: "{{ plex_temp_dir }}"
    state: directory
    owner: "{{ plex_run_user | default('plex', true) }}"
    group: "{{ plex_run_group | default('plex', true) }}"
    mode: "0755"
  when: plex_temp_dir | default('', true) | length > 0

- name: Create Plex Media Server service drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ plex_service_name }}.service.d"
    state: directory
    mode: "0755"
  when: plex_overrides_configured | bool

- name: Configure Plex Media Server service overrides
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ plex_service_name }}.service.d/override.conf"
    content: "{{ lookup('ansible.builtin.template', 'plex-service-override.conf.j2') }}"
    mode: "0644"
  when: plex_overrides_configured | bool
  notify: Restart Plex Media Server

- name: Remove Plex Media Server service override drop-in
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ plex_service_name }}.service.d/override.conf"
    state: absent
  when: not (plex_overrides_configured | bool)
  notify: Restart Plex Media Server

- name: Ensure Plex Media Server is running and enabled
  ansible.builtin.service:
    name: "{{ plex_service_name }}"
    state: "{{ plex_service_state }}"
    enabled: "{{ plex_service_enabled }}"
